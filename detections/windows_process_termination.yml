title: Windows Command Shell Execution
id: 78e8b422-2715-474f-9d20-5db4c4bae8ee
status: experimental
description: Detects Sysmon process creation events for cmd.exe, providing visibility into Windows Command Shell execution.
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: Cyberion ThreatShield
date: 2026-09-26
tags:
    - attack.t1059.003
logsource:
    product: windows
detection:
    selection:
        EventID: 1
        Image|endswith: '\cmd.exe'
    condition: selection
falsepositives:
    - Legitimate administrative command-line activity
    - Software installation and maintenance
    - Authorized system scripts
level: medium
