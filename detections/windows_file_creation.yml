title: LSASS Memory Dump File Creation
id: 907bea5a-5e9d-4a0c-8e47-84dddcf110a3
status: experimental
description: Detects Sysmon file creation events for files associated with LSASS memory dumps.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Cyberion ThreatShield
date: 2026-09-26
tags:
    - attack.t1003.001
logsource:
    product: windows
detection:
    selection_event:
        EventID: 11
    selection_filename:
        TargetFilename|contains:
            - '\lsass.dmp'
            - '\lsass.exe_'
            - '\lsass ('
            - '\minidump_'
            - '\dumpert.dmp'
    condition: selection_event and selection_filename
falsepositives:
    - Authorized forensic memory acquisition
    - Incident response investigations
    - Security testing
level: high
