title: Suspicious PowerShell Credential Collection
id: c7d90517-83f0-4f08-b9aa-4554f4d99048
status: experimental
description: Detects PowerShell Script Block Logging events containing commands commonly associated with credential collection or credential validation.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Cyberion ThreatShield
date: 2026-09-26
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    service: powershell
detection:
    selection:
        EventID: 4104
        ScriptBlockText|contains:
            - PromptForCredential
            - GetNetworkCredential
            - ValidateCredentials
            - Get-Credential
    condition: selection
falsepositives:
    - Legitimate administrative scripts that request or validate credentials
    - Security testing and troubleshooting scripts
level: high
