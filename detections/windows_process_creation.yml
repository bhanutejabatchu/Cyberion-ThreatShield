title: Windows User Discovery via Whoami
id: b885494c-b2a1-4525-94d5-c8edc36deca7
status: experimental
description: Detects Sysmon process creation events where whoami.exe is executed to identify the current Windows user.
references:
    - https://attack.mitre.org/techniques/T1033/
author: Cyberion ThreatShield
date: 2026-09-26
tags:
    - attack.discovery
logsource:
    product: windows
detection:
    selection:
        EventID: 1
        Image|endswith: '\whoami.exe'
    condition: selection
falsepositives:
    - Normal Windows process execution
    - Legitimate applications and services
    - Software installation and maintenance
level: low
